prefix: '&8[&bRealTime&8]&r '
command:
  now: '{prefix}&f当前时间：&e{datetime}&7（{timezone}）'
  info:
    header: '{prefix}&bRealTime 运行信息'
    version: '{prefix}&7版本：&f{version}'
    timezone: '{prefix}&7时区：&f{timezone}'
    locale: '{prefix}&7语言：&f{locale}'
    global-enabled: '{prefix}&7全局启用：&f{enabled}'
    command-enabled: '{prefix}&7命令模块启用：&f{enabled}'
    redstone-enabled: '{prefix}&7红石输出模块：&f{enabled}'
  help:
    header: '{prefix}&bRealTime &7常用命令（&f/rtime help all&7 看全部）'
    time: '{prefix}&f/rtime &7- 现在几点'
    create: '{prefix}&f/rtime create <名字> [bcd|analog] [second|minute] &7- 在你面前建一台钟（默认 bcd + 按分），建完自动亮'
    info: '{prefix}&f/rtime info [设备] &7- 看插件状态与所有钟；给设备名看细节'
    toggle: '{prefix}&f/rtime on|off <设备> &7- 开机 / 关机'
    remove: '{prefix}&f/rtime remove <设备> &7- 拆掉这台钟（自动清理它放下的方块）'
    footer: '{prefix}&7设备名和槽位号都能用 Tab 补全；示例见 &f/rtime help create'
    advanced:
      header: '{prefix}&b进阶'
    place: '{prefix}&f/rtime place <设备> <槽位> [x y z] &7- 把某个源放到准星位置，用来避开被占的格子'
    status: '{prefix}&f/rtime status &7- 输出诊断（排查"为什么不亮"）'
    cleanup: '{prefix}&f/rtime cleanup [list|retry|dismiss] [任务ID] &7- 拆钟后的清理队列'
    reload: '{prefix}&f/rtime reload &7- 重载配置'
    topic:
      create: '{prefix}&7细节：不给坐标就用玩家位置与朝向；&fmanual &7建一台未启用的空钟（用 place 逐位放），&fnodisplay &7不放灯/讲台；显式坐标形式 &f/rtime create clock bcd second world 100 70 0 x+ &7仍可用'
      place: '{prefix}&7细节：设备要先 &f/rtime off <设备>&7；槽位号从 0 开始（Tab 补全）；位置可以反复改，用来避开已经被占用的格子'
      cleanup: '{prefix}&7细节：&f/rtime cleanup &7看队列；&f/rtime cleanup retry <任务ID> &7重试"需人工处理"的项；&f/rtime cleanup dismiss <任务ID> &7确认方块保持原样并丢弃任务'
  reload:
    success: '{prefix}&a配置重新加载成功。'
    failure: '{prefix}&c配置重新加载失败，旧配置继续生效：&f{reason}'
  device:
    unavailable: '{prefix}&c设备管理服务当前不可用。'
    remove:
      success: '{prefix}&a设备 &f{name} &a已退休，清理任务已入队：&f{job}'
      must-disable: '{prefix}&c请先禁用设备再执行移除：&f{id}'
      not-found: '{prefix}&c未找到设备：&f{id}'
      error: '{prefix}&c设备移除失败：&f{reason}'
    cleanup:
      header: '{prefix}&b待清理设备队列（{count}）'
      empty: '{prefix}&7当前没有待清理设备。'
      item: '{prefix}&f{name} &7[{id}] &8世界：&f{world} &8待处理：&e{pending} &8需人工处理：&c{attention}'
      retry:
        success: '{prefix}&a已重新排队清理任务：&f{id}'
      dismiss:
        success: '{prefix}&a已丢弃清理任务 &f{name} &7[{id}]&a，相关方块保持原样。'
        has-pending: '{prefix}&c该任务还有待处理项，请等它跑完再丢弃：&f{id}'
      invalid-id: '{prefix}&c清理任务 ID 格式无效：&f{id}'
      not-found: '{prefix}&c未找到清理任务：&f{id}'
      error: '{prefix}&c清理任务操作失败：&f{reason}'
    status:
      header: '{prefix}&b设备输出诊断'
      devices: '{prefix}&7配置设备：&f{configured} &7启用：&f{enabled} &7输出点：&f{outputs}'
      checks: '{prefix}&7输出检查：&f{checks} &7未加载区块跳过：&f{unloaded} &7过期配置更新：&f{stale}'
      outcomes: '{prefix}&7输出变更：&f{changed} &7无变化：&f{unchanged} &7非法方块：&f{invalid} &7写入失败：&f{failures}'
      analog: '{prefix}&7讲台放置：&f{lecterns} &7书页安装：&f{books}'
      demo: '{prefix}&7示例方块放置：&f{placed} &7清除：&f{cleared}'
    list:
      header: '{prefix}&b设备列表（{count}）'
      empty: '{prefix}&7当前没有配置任何设备。'
      item: '{prefix}&f{name} &7[{id}] &8世界：&f{world} &8状态：{enabled}'
    info:
      header: '{prefix}&b设备信息：&f{name}'
      id: '{prefix}&7ID：&f{id}'
      world: '{prefix}&7世界：&f{world}'
      enabled: '{prefix}&7状态：{enabled}'
      resolution: '{prefix}&7分辨率：&f{resolution}'
      encoding: '{prefix}&7编码：&f{encoding}'
      outputs: '{prefix}&7输出点（{count}）：'
      output: '{prefix}&8槽 {bit}：&f{x}, {y}, {z}'
      output-unplaced: '{prefix}&8槽 {bit}：&7未放置（用 /rtime place <设备> {bit} 定位）'
    state:
      enabled: '&a启用'
      disabled: '&c禁用'
    create:
      success: '{prefix}&a设备已创建：&f{name} &7[{id}] &8{resolution} &8{encoding} &8{world} &7{count} 个输出 &8（默认禁用，槽位每格间隔 1 空气，BCD 每 4 位一组；确认接线后 device enable）'
      invalid-resolution: '{prefix}&c分辨率无效：&f{value} &7（可用：minute、second）'
      invalid-encoding: '{prefix}&c编码无效：&f{value} &7（可用：bcd、analog）'
      limit: '{prefix}&c设备数量已达上限（{limit}），请先移除不再使用的设备。'
      area: '{prefix}&c坐标不在允许区域内：&f{world} {x}, {z}'
      conflict: '{prefix}&c该坐标已被其他设备或清理任务占用：&f{x}, {y}, {z}'
      built: '{prefix}&a已创建 &f{name} &7[{id}] &8{encoding} {resolution} &8{world} &7{count} 个源 + &f{display} &7个展示方块 &8状态：{state}'
      manual-hint: '{prefix}&7这是一台未启用的空钟。用 &f/rtime device place {name} <0..{max}> &7逐个定位（对准目标方块执行即可），全部就位后 &f/rtime device enable {name}&7。'
      invalid-modifier: '{prefix}&c未知参数：&f{value} &7（可用：second / minute / nodisplay / manual）'
    warn:
      redstone-disabled: '{prefix}&e注意：红石输出模块未启用（plugins/RealTime/modules/redstone.yml → enabled: true），设备不会真的输出或放置方块。改完执行 /rtime reload。'
    placement-required: '{prefix}&c这条命令需要玩家视角：请以玩家身份站在目标位置，或在 6 格内看着一个方块。'
    ambiguous: '{prefix}&c找到 {count} 台同名设备，请改用 ID：&f{name}'
    place:
      display-hint: '{prefix}&7提示：灯/比较器这些展示方块是建钟时按默认布局放好的，不会跟着槽位移动。&f{encoding} &7设备只需要源本身（BCD 红石块 / analog 讲台），展示部分请自己接，或用 &fmanual &7模式建一台不带展示方块的钟。'
      world-mismatch: '{prefix}&c这台设备属于世界 &f{world}&c，你当前在 &f{current}&c。'
    demo:
      success: '{prefix}&a教学示例已生成：&f{name} &7[{id}] &8{encoding} &8{world} &7{count} 个槽位 + &f{display} &7个展示方块 &8起点 {x}, {y}, {z}（已启用；用 device remove 可整体清除）'
      hint: '{prefix}&e提示：插件只填空位。建示例前请确认该区域是空地，否则被地形占住的位置会报非法方块，退役时会变成需人工处理（可用 device cleanup retry / dismiss 收尾）。'
    set:
      success: '{prefix}&a槽 {bit} 已改为 &f{x}, {y}, {z}'
      must-disable: '{prefix}&c请先禁用设备再改槽位（启用中的设备会持续写旧槽位）：&f{id}'
      index: '{prefix}&c位号超出范围（0–{max}）：&f{bit}'
    edit:
      cooldown: '{prefix}&c操作太快，请 &f{seconds} &c秒后再试。'
    enable:
      success: '{prefix}&a设备 {name} 已启用。&7({id})'
      incomplete: '{prefix}&c还有 {count} 个槽位没有位置，先用 /rtime place <设备> <槽位> 逐个摆好再开机。'
    disable:
      success: '{prefix}&e设备 {name} 已禁用。&7({id})'
    invalid-id: '{prefix}&c设备 ID 格式无效：&f{id}'
    not-found: '{prefix}&c未找到设备：&f{id}'
    error: '{prefix}&c设备操作或刷新失败：&f{reason}'
  no-permission: '{prefix}&c你没有权限执行此操作。'
  disabled: '{prefix}&cRealTime 或命令模块当前已禁用。'
  usage: '{prefix}&f用法：&e/rtime help&7 看常用命令与示例（&e/rtime help all&7 看全部）'
