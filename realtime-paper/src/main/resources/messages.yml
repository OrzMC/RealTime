prefix: '&8[&bRealTime&8]&r '
command:
  now: '{prefix}&f当前时间：&e{datetime}&7（{timezone}）'
  info:
    header: '{prefix}&bRealTime 运行信息'
    version: '{prefix}&7版本：&f{version}'
    timezone: '{prefix}&7时区：&f{timezone}'
    locale: '{prefix}&7语言：&f{locale}'
    global-enabled: '{prefix}&7全局启用：&f{enabled}'
    command-enabled: '{prefix}&7命令模块启用：&f{enabled}'
    redstone-enabled: '{prefix}&7红石输出模块：&f{enabled}'
  overview:
    header: '{prefix}&b钟（{count}）'
    empty: '{prefix}&7还没有任何钟。站在要建的位置执行 &f/rtime create <名字>&7。'
    item: '{prefix}{state} &f{name} &8· &7{resolution} &8· &7{count} 个讲台{extra}'
    unplaced: ' &8· &c{count} 个未放置'
    cleanup-hint: '{prefix}&7还有 {count} 个清理任务没跑完：&f/rtime cleanup'
  device:
    header: '{prefix}&b钟：&f{name}'
    state-line: '{prefix}&7状态：{state}'
    world: '{prefix}&7世界：&f{world}'
    resolution: '{prefix}&7精度：&f{resolution} &7（{count} 个讲台）'
    outputs: '{prefix}&7槽位（{count}）：'
    output: '{prefix}&8槽 {bit}：&f{x}, {y}, {z}'
    output-unplaced: '{prefix}&8槽 {bit}：&7未放置（&f/rtime place {name} {bit}&7 立讲台）'
    hint: '{prefix}&7操作：&f/rtime on {name}&7 · &f/rtime off {name}&7 · &f/rtime place {name} <槽位>&7 · &f/rtime remove {name}'
    state-enabled: '&a启用'
    state-disabled: '&c禁用'
  create:
    built: '{prefix}&a已建好 &f{name} &8· &7{resolution} · &7{count} 个讲台 + {display} 个展示方块 &8· {state}'
    manual-hint: '{prefix}&7槽位都还没位置：对着目标方块执行 &f/rtime place {name} <0..{max}>&7，每摆一个会立刻立起讲台；全部摆完 &f/rtime on {name}&7。'
    unknown-option: '{prefix}&c不认识的参数：&f{value} &7（可用：minute / second / manual / nodisplay / at <x y z> / facing <朝向>）'
    duplicate-option: '{prefix}&c参数重复：&f{value}'
    duplicate-name: '{prefix}&c已经有一台叫 &f{name}&c 的钟了，换个名字。'
    reserved-name: '{prefix}&c&f{name}&c 是命令关键字，换一个名字。'
    missing-coordinates: '{prefix}&c&fat &7后面要跟三个整数：&f/rtime create clock at 100 64 0'
    invalid-coordinate: '{prefix}&c坐标无效：&f{value}'
    invalid-facing: '{prefix}&c朝向无效：&f{value} &7（可用：north、south、east、west）'
    placement-required: '{prefix}&c建钟要在游戏里执行：站到目标位置再输入命令（控制台没有朝向和世界）。'
    limit: '{prefix}&c钟的数量已达上限（{limit}），请先拆掉不用的。'
    area: '{prefix}&c坐标不在允许区域内：&f{world} {x}, {z}'
    conflict: '{prefix}&c这个位置已经被占用：&f{x}, {y}, {z}'
  place:
    success: '{prefix}&a槽 {bit} 已放到 &f{x}, {y}, {z}&a，讲台已立起。'
    invalid-slot: '{prefix}&c槽位号无效：&f{value}'
    invalid-coordinates: '{prefix}&c坐标无效：&f{value}'
    world-mismatch: '{prefix}&c这台钟在世界 &f{world}&c，你当前在 &f{current}&c。'
    must-disable: '{prefix}&c先关机再摆位（开着的钟会一直写旧槽位）：&f/rtime off <名字>'
    index: '{prefix}&c槽位超出范围（0–{max}）：&f{bit}'
  toggle:
    enabled: '{prefix}&a{name} 已开机。'
    disabled: '{prefix}&e{name} 已关机（讲台保留，输出归零）。'
    incomplete: '{prefix}&c还有 {count} 个槽位没有位置：用 &f/rtime place <名字> <槽位>&7 摆好再开机。'
  remove:
    success: '{prefix}&a{name} 已拆除，清理任务入队：&f{job}'
    must-disable: '{prefix}&c先关机再拆：&f/rtime off <名字>'
    not-found: '{prefix}&c没有这台钟：&f{name}'
  status:
    header: '{prefix}&b运行状态'
    devices: '{prefix}&7钟：&f{configured} 台（开着 {enabled} 台）· 槽位：&f{outputs}'
    checks: '{prefix}&7输出检查：&f{checks} · 未加载区块跳过：&f{unloaded} · 过期配置：&f{stale}'
    outcomes: '{prefix}&7变化：&f{changed} · 无变化：&f{unchanged} · 非法方块：&f{invalid} · 写入失败：&f{failures}'
    display: '{prefix}&7展示方块：放置 &f{placed}&7 · 清除 &f{cleared}'
    analog: '{prefix}&7讲台：放置 &f{lecterns}&7 · 书页写入 &f{books}'
    ignored: '{prefix}&e有 {count} 台旧版 BCD 钟已不再加载（本版本已移除 BCD 编码），请从 devices.yml 里删掉：&f{names}'
  cleanup:
    header: '{prefix}&b清理队列（{count}）'
    empty: '{prefix}&7清理队列是空的。'
    item: '{prefix}&f{name} &7[{id}] &8{world} &8待处理：&e{pending} &8需人工处理：&c{attention}'
    retry-success: '{prefix}&a已重新排队：&f{id}'
    dismiss-success: '{prefix}&a已丢弃清理任务 &f{name} &7[{id}]&a，方块保持原样。'
    dismiss-has-pending: '{prefix}&c这个任务还有待处理项，等它跑完再丢弃：&f{id}'
    invalid-id: '{prefix}&c清理任务 ID 格式无效：&f{id}'
    not-found: '{prefix}&c没有这个清理任务：&f{id}'
    error: '{prefix}&c清理任务操作失败：&f{reason}'
  update:
    checking: '{prefix}&7正在检查新版本…'
    downloading: '{prefix}&7正在下载新版本…'
    idle: '{prefix}&7更新：还没有检查过（&f/rtime update&7 立刻检查）'
    latest: '{prefix}&7更新：已是最新（&f{version}&7）'
    available: '{prefix}&e更新：&f{version}&e 可用（当前 &f{current}&e，来源 &f{source}&e）· &f/rtime update download&7 下载到更新目录'
    downloaded: '{prefix}&a已下载 &f{version}&a 到 &f{file}&a（&f{bytes}&a 字节，校验通过）。重启服务器即生效。'
    pending: '{prefix}&e更新：&f{version}&e 已下载待重启（&f{file}&e）'
    disabled: '{prefix}&7更新检查已关闭：&f{reason}'
    failed: '{prefix}&c更新检查失败：&f{reason}'
    refused: '{prefix}&c没有下载：&f{reason}'
  help:
    header: '{prefix}&bRealTime 命令'
    time: '{prefix}&f/rtime &7- 现在几点 + 所有钟'
    device: '{prefix}&f/rtime <钟名> &7- 这台钟的详情'
    create: '{prefix}&f/rtime create <名字> [minute] [manual] [at x y z] [facing 朝向] &7- 在你面前建一台钟（默认按秒、带展示方块、自动开机）'
    toggle: '{prefix}&f/rtime on|off <钟名> &7- 开机 / 关机'
    place: '{prefix}&f/rtime place <钟名> <槽位> &7- 把某个槽位摆到你看着的位置（讲台立刻立起来）'
    remove: '{prefix}&f/rtime remove <钟名> &7- 拆掉并清理方块（先 off）'
    status: '{prefix}&f/rtime status &7- 输出诊断（排查"为什么不亮"）'
    cleanup: '{prefix}&f/rtime cleanup [retry|dismiss <任务ID>] &7- 拆钟后的清理队列'
    update: '{prefix}&f/rtime update [check|download] &7- 检查新版本 / 下载到 plugins/update（重启生效）'
    reload: '{prefix}&f/rtime reload &7- 重载配置'
    footer: '{prefix}&7名字和槽位号都能 Tab 补全；&fmanual &7建一台自己摆位的钟，&fnodisplay &7不放比较器/灯。'
  removed: '{prefix}&e&f{verb}&e 这个写法已经移除，改用 &f{replacement}&e。'
  not-found: '{prefix}&c没有这台钟：&f{name} &7（&f/rtime&7 看全部）'
  ambiguous: '{prefix}&c有 {count} 台钟都叫 &f{name}&c，请先在 devices.yml 里改名。'
  reload:
    success: '{prefix}&a配置重新加载成功。'
    failure: '{prefix}&c配置重新加载失败，旧配置继续生效：&f{reason}'
  retry: '{prefix}&c操作太快，请 &f{seconds} &c秒后再试。'
  warn:
    redstone-disabled: '{prefix}&e注意：红石输出模块未启用（plugins/RealTime/modules/redstone.yml → enabled: true），设备不会真的输出或放置方块。改完执行 /rtime reload。'
  unavailable: '{prefix}&c设备管理服务当前不可用。'
  invalid-id: '{prefix}&cID 无效：&f{id}'
  error: '{prefix}&c设备操作失败：&f{reason}'
  no-permission: '{prefix}&c你没有权限执行此操作。'
  disabled: '{prefix}&cRealTime 或命令模块当前已禁用。'
  usage: '{prefix}&f用法：&e/rtime help'
