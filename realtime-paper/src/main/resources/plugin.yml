name: RealTime
version: '${project.version}'
main: cn.orzmc.realtime.paper.RealTimePlugin
api-version: '26.3'
folia-supported: true
softdepend: [PlaceholderAPI]
authors: [OrzMC]
website: https://github.com/OrzMC/RealTime
description: Real-world time services and devices for Paper and Folia.
commands:
  rtime:
    description: Query RealTime plugin status and real-world time.
    usage: /rtime [now|info|reload|device list|device info <uuid>|device status|device cleanup list|device cleanup retry <job-uuid>|device enable <uuid>|device disable <uuid>|device remove <uuid>]
    permission: realtime.command
permissions:
  realtime.command:
    description: Allows querying the current time and plugin info.
    default: true
  realtime.device.view:
    description: Allows listing devices, inspecting them and reading diagnostics and the cleanup queue.
    default: true
  realtime.device.toggle:
    description: Allows enabling and disabling existing devices.
    default: op
    children:
      realtime.device.view: true
  realtime.device.edit:
    description: Allows creating devices and moving their output slots (writes blocks in the world).
    default: op
    children:
      realtime.device.view: true
  realtime.device.retire:
    description: Allows retiring a disabled device and retrying deferred cleanup.
    default: op
    children:
      realtime.device.view: true
  realtime.admin:
    description: Allows reloading the configuration and every device administration action.
    default: op
    children:
      realtime.command: true
      realtime.device.toggle: true
      realtime.device.edit: true
      realtime.device.retire: true
