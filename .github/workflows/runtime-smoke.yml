name: Paper and Folia Runtime Smoke Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-smoke-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [paper, folia]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build plugin
        run: ./gradlew --no-daemon :realtime-paper:shadowJar
      - name: Start server and execute /rtime over RCON
        env:
          PROJECT_VERSION: 0.2.0-SNAPSHOT
        run: bash scripts/smoke-server.sh "${{ matrix.project }}"

  cleanup-smoke:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [paper, folia]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Validate cleanup smoke script
        run: bash -n scripts/smoke-device-cleanup.sh
      - name: Build plugin
        run: ./gradlew --no-daemon :realtime-paper:shadowJar
      - name: Verify cleanup recovery, operator retry, and safe device retirement
        env:
          PROJECT_VERSION: 0.2.0-SNAPSHOT
        run: bash scripts/smoke-device-cleanup.sh "${{ matrix.project }}"

  placeholderapi-smoke:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [paper, folia]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build plugin
        run: ./gradlew --no-daemon :realtime-paper:shadowJar
      - name: Start server with PlaceholderAPI and parse placeholders
        env:
          PROJECT_VERSION: 0.2.0-SNAPSHOT
          WITH_PLACEHOLDERAPI: 'true'
        run: bash scripts/smoke-server.sh "${{ matrix.project }}"
