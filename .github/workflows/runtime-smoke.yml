name: Paper and Folia Runtime Smoke Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        project: [paper, folia]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build plugin
        run: ./gradlew --no-daemon :realtime-paper:shadowJar
      - name: Start server and execute /rtime over RCON
        env:
          PROJECT_VERSION: 0.1.0-SNAPSHOT
        run: bash scripts/smoke-server.sh "${{ matrix.project }}"
