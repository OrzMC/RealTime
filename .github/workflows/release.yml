name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch or tag)"
        required: false
        default: "main"
      version:
        description: "Version to exercise, e.g. 0.5.0 (must match the CHANGELOG section for a real release)"
        required: true
      dry_run:
        description: "Build + distribution preflight only: no GitHub Release, no Hangar/Modrinth upload"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build release artifact
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      dry_run: ${{ steps.metadata.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      # A tag push validates the tag against its CHANGELOG section because that
      # is what the release notes are rendered from. A manual run passes the
      # version explicitly and only checks that the section exists when the run
      # is meant to publish, so the upload path can be exercised before the
      # release-prep commit lands.
      - name: Resolve version, validate tag and changelog
        id: metadata
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN:-false}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          if [[ "${DRY_RUN:-false}" == "true" ]]; then
            echo "dry run: skipping tag/CHANGELOG validation, previewing the newest section instead"
            NEWEST="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+[^]]*\]' CHANGELOG.md | sed -E 's/^## \[(.*)\]$/\1/')"
            bash scripts/extract-release-notes.sh "${NEWEST}" > dist/release-notes.md
            echo "preview notes from CHANGELOG section $NEWEST"
          else
            bash scripts/validate-release.sh "v$VERSION"
            bash scripts/extract-release-notes.sh "$VERSION" > dist/release-notes.md
          fi

      - name: Distribution metadata check
        env:
          HANGAR_PROJECT_ID: ${{ vars.HANGAR_PROJECT_ID }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: bash scripts/distribution-check.sh --version "${{ steps.metadata.outputs.version }}"

      - name: Verify and build versioned shaded JAR
        run: >
          ./gradlew --no-daemon
          -PprojectVersion="${{ steps.metadata.outputs.version }}"
          clean check spotlessCheck build

      - name: Inspect shaded JAR
        env:
          PROJECT_VERSION: ${{ steps.metadata.outputs.version }}
        run: bash scripts/inspect-jar.sh

      - name: Generate SHA-256 checksum
        env:
          PROJECT_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          ARTIFACT="realtime-paper/build/libs/RealTime-$PROJECT_VERSION.jar"
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          cp "$ARTIFACT" dist/
          cp "$ARTIFACT.sha256" dist/

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: RealTime-${{ steps.metadata.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish protected release
    needs: build
    if: ${{ vars.RELEASE_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # `release` is locked to `v*` tags and holds the publishing tokens, so a
    # manual dry run (which only reads repository variables) uses a separate,
    # unprotected environment. Otherwise the job would fail at setup, not in a
    # step, which is impossible to diagnose from the logs.
    environment:
      name: ${{ needs.build.outputs.dry_run == 'true' && 'release-dry-run' || 'release' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: RealTime-${{ needs.build.outputs.version }}
          path: dist/

      # Blocking on a dry run (that is the whole point of the run), advisory on
      # a real release (a network blip must not block a release).
      - name: Distribution preflight
        continue-on-error: ${{ needs.build.outputs.dry_run != 'true' }}
        env:
          HANGAR_PROJECT_ID: ${{ vars.HANGAR_PROJECT_ID }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: bash scripts/distribution-check.sh --remote --version "${{ needs.build.outputs.version }}"

      - name: Create GitHub Release
        if: ${{ needs.build.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # A tag push implies the tag exists. A manual non-dry run is only for
          # republishing an existing tag, so refuse to create one from a branch.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION does not exist in $GITHUB_REPOSITORY; push the tag instead of dispatching a publish run" >&2
            exit 1
          fi
          # Re-runnable: a failed Hangar/Modrinth step must not force a tag dance,
          # so an existing release gets its assets and notes refreshed instead.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists; refreshing its assets"
            gh release upload "v$VERSION" \
              "dist/RealTime-$VERSION.jar" \
              "dist/RealTime-$VERSION.jar.sha256" \
              --clobber
            gh release edit "v$VERSION" \
              --title "RealTime v$VERSION" \
              --notes-file dist/release-notes.md
          else
            gh release create "v$VERSION" \
              "dist/RealTime-$VERSION.jar" \
              "dist/RealTime-$VERSION.jar.sha256" \
              --title "RealTime v$VERSION" \
              --notes-file dist/release-notes.md
          fi

      - name: Publish stable version to Hangar
        if: ${{ needs.build.outputs.dry_run != 'true' && vars.HANGAR_PROJECT_ID != '' && !contains(needs.build.outputs.version, '-') }}
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          HANGAR_PROJECT_ID: ${{ vars.HANGAR_PROJECT_ID }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ -z "$HANGAR_API_TOKEN" ]]; then
            echo "HANGAR_API_TOKEN is not configured; skipping Hangar upload."
            exit 0
          fi
          # Maven Central answers 403 often enough to matter (v0.6.0 hit it while
          # resolving the Hangar plugin's own dependencies), so retry once.
          for attempt in 1 2; do
            if ./gradlew --no-daemon \
              -PprojectVersion="$VERSION" \
              -PhangarProjectId="$HANGAR_PROJECT_ID" \
              -PhangarPaperVersions="26.3" \
              :realtime-paper:publishPluginPublicationToHangar; then
              exit 0
            fi
            if [[ "$attempt" == "2" ]]; then
              echo "Hangar publication failed twice; see the log above." >&2
              exit 1
            fi
            echo "Hangar publication failed (attempt $attempt); retrying in 30s..." >&2
            sleep 30
          done

      # The Hangar main page is the long description in
      # docs/operations/platform-listings.md; Hangar exposes it as a page that can
      # be PATCHed, so the release keeps it in sync instead of relying on manual
      # pastes. A failure here must not fail the release itself.
      - name: Sync the Hangar main page
        if: ${{ needs.build.outputs.dry_run != 'true' && vars.HANGAR_PROJECT_ID != '' }}
        continue-on-error: true
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          HANGAR_PROJECT_ID: ${{ vars.HANGAR_PROJECT_ID }}
        run: bash scripts/hangar-page.sh

      - name: Publish version to Modrinth
        if: ${{ needs.build.outputs.dry_run != 'true' && vars.MODRINTH_PROJECT_ID != '' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ -z "$MODRINTH_TOKEN" ]]; then
            echo "MODRINTH_TOKEN is not configured; skipping Modrinth upload."
            exit 0
          fi

          if [[ "$VERSION" == *-* ]]; then
            VERSION_TYPE="beta"
          else
            VERSION_TYPE="release"
          fi

          CHANGELOG="$(cat dist/release-notes.md)"
          DATA="$(jq -cn \
            --arg name "RealTime $VERSION" \
            --arg version "$VERSION" \
            --arg changelog "$CHANGELOG" \
            --arg project "$MODRINTH_PROJECT_ID" \
            --arg type "$VERSION_TYPE" \
            '{
              name: $name,
              version_number: $version,
              changelog: $changelog,
              game_versions: ["26.3"],
              loaders: ["paper", "folia"],
              version_type: $type,
              featured: false,
              status: "listed",
              project_id: $project,
              file_parts: ["plugin"],
              primary_file: "plugin",
              dependencies: []
            }')"

          curl --fail-with-body --retry 2 \
            --request POST "https://api.modrinth.com/v2/version" \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header "User-Agent: OrzMC/RealTime (https://github.com/OrzMC/RealTime)" \
            --form "data=$DATA;type=application/json" \
            --form "plugin=@dist/RealTime-$VERSION.jar;type=application/java-archive"

      - name: Summarize
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DRY_RUN: ${{ needs.build.outputs.dry_run }}
          HANGAR_ID: ${{ vars.HANGAR_PROJECT_ID }}
          MODRINTH_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          {
            echo "### Release run summary"
            echo
            echo "| item | value |"
            echo "|---|---|"
            echo "| version | \`$VERSION\` |"
            echo "| dry run | \`$DRY_RUN\` |"
            echo "| GitHub Release | $( [[ "$DRY_RUN" == "true" ]] && echo 'skipped' || echo 'created' ) |"
            echo "| Hangar | $([[ -z "$HANGAR_ID" ]] && echo 'skipped (no project id)' || { [[ "$DRY_RUN" == "true" ]] && echo 'skipped (dry run)' || echo "attempted (\`$HANGAR_ID\`)"; }) |"
            echo "| Modrinth | $([[ -z "$MODRINTH_ID" ]] && echo 'skipped (no project id)' || { [[ "$DRY_RUN" == "true" ]] && echo 'skipped (dry run)' || echo "attempted (\`$MODRINTH_ID\`)"; }) |"
          } >> "$GITHUB_STEP_SUMMARY"
